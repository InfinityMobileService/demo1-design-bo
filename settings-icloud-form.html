<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เพิ่มข้อมูล iCloud — บ้านมือถือ MBH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="app">
<script>window.PAGE = { active: "settings-icloud", title: "เพิ่มข้อมูล iCloud", crumbs: ["ตั้งค่าระบบ", "iCloud", "เพิ่มข้อมูล"] };</script>
<script src="assets/layout.js"></script>
<div class="main">
<div class="content">

  <div class="page-head">
    <div><div class="page-title">เพิ่มข้อมูล iCloud</div><div class="page-desc">บันทึกบัญชี iCloud และคำถามรักษาความปลอดภัยของลูกค้า</div></div>
    <div class="page-actions"><a href="settings-icloud-list.html" class="btn btn-outline"><i data-lucide="arrow-left"></i> กลับรายการ</a></div>
  </div>

  <form>
    <div class="card card-pad">
      <div class="form-section-title">ข้อมูลบัญชี iCloud</div>
      <div class="form-grid">
        <div class="field"><label for="icloud-email">อีเมล <span class="req">*</span></label><input id="icloud-email" name="email" type="email" value="nattapol.saeng@icloud.com" placeholder="กรอกอีเมล" required><div class="hint">อีเมลที่ใช้เข้าสู่บัญชี iCloud</div></div>
        <div class="field"><label for="icloud-code">รหัส iCloud <span class="req">*</span></label><div class="toolbar"><input id="icloud-code" name="icloud_code" class="input" type="text" value="ICL-9Q7X-2569" placeholder="กรอกรหัส iCloud" required><button type="button" class="btn btn-outline btn-sm">สร้างรหัส</button></div><div class="hint">รหัสอ้างอิงสำหรับค้นหาในระบบ</div></div>
        <div class="field"><label for="birth-date">วันเกิด <span class="req">*</span></label><input id="birth-date" name="birth_date" type="date" value="1996-03-12" required><div class="hint">ตัวอย่างข้อมูล: 12 มีนาคม 2539</div></div>
      </div>
    </div>

    <div class="card card-pad mt-20">
      <div class="form-section-title">คำถามรักษาความปลอดภัย</div>
      <div class="form-grid">
        <div class="field"><label for="question-1">คำถามที่ 1 <span class="req">*</span></label><input id="question-1" name="question_1" type="text" value="ชื่อสัตว์เลี้ยงตัวแรกของคุณคืออะไร" placeholder="กรอกคำถามที่ 1" required></div>
        <div class="field"><label for="answer-1">คำตอบที่ 1 <span class="req">*</span></label><input id="answer-1" name="answer_1" type="text" value="มะลิ" placeholder="กรอกคำตอบที่ 1" required></div>
        <div class="field"><label for="question-2">คำถามที่ 2 <span class="req">*</span></label><input id="question-2" name="question_2" type="text" value="เมืองที่คุณเกิดคือที่ใด" placeholder="กรอกคำถามที่ 2" required></div>
        <div class="field"><label for="answer-2">คำตอบที่ 2 <span class="req">*</span></label><input id="answer-2" name="answer_2" type="text" value="เชียงใหม่" placeholder="กรอกคำตอบที่ 2" required></div>
        <div class="field"><label for="question-3">คำถามที่ 3 <span class="req">*</span></label><input id="question-3" name="question_3" type="text" value="ชื่อโรงเรียนประถมของคุณคืออะไร" placeholder="กรอกคำถามที่ 3" required></div>
        <div class="field"><label for="answer-3">คำตอบที่ 3 <span class="req">*</span></label><input id="answer-3" name="answer_3" type="text" value="อนุบาลดอยหล่อ" placeholder="กรอกคำตอบที่ 3" required></div>
      </div>
      <div class="page-desc mt-20">ข้อมูลคำถามและคำตอบใช้สำหรับตรวจสอบบัญชีเท่านั้น ควรตรวจทานการสะกดก่อนบันทึก</div>
    </div>

    <div class="form-footer"><a href="settings-icloud-list.html" class="btn btn-outline">ยกเลิก</a><button type="button" class="btn btn-primary">บันทึก</button></div>
  </form>

</div>
</div>
</div>
</body>
</html>
