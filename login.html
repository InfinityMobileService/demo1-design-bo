<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — บ้านมือถือ MBH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html, body { min-height: 100%; }
  body { background: var(--white); }
  .shell {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(380px, 1fr);
    min-height: 100vh;
  }
  .hero {
    position: relative;
    padding: 0;
    overflow: hidden;
    background: #1A1916;
  }
  .hero img {
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .pane {
    display: grid;
    place-items: center;
    padding: 40px 48px;
    background: var(--white);
    border-left: 1px solid var(--border);
  }
  .gate { width: 100%; max-width: 400px; }
  .gate-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .gate-brand img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
  .gate-brand b { display: block; font-size: 14px; }
  .gate-brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .gate h1 { font-size: 22px; font-weight: 650; margin-bottom: 4px; }
  .gate .lead { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .gate .field { margin-bottom: 14px; }
  .gate-go { width: 100%; justify-content: center; height: 40px; margin-top: 8px; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .hero { min-height: 240px; }
    .hero img { max-width: none; }
    .pane { border-left: 0; border-top: 1px solid var(--border); padding: 28px 20px 40px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="hero">
    <img src="assets/shop.jpg" alt="หน้าร้านบ้านมือถือ">
  </aside>
  <main class="pane">
    <div class="gate">
      <div class="gate-brand">
        <img src="assets/logo.jpg" alt="">
        <div><b>บ้านมือถือ</b><small>ระบบหลังบ้าน · MBH</small></div>
      </div>
      <h1>เข้าสู่ระบบ</h1>
      <p class="lead">กรอกชื่อผู้ใช้และรหัสผ่านของพนักงาน</p>

      <form action="dashboard.html" method="get">
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input id="username" name="username" type="text" placeholder="ชื่อผู้ใช้" autocomplete="username" value="supaporn">
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
        </div>
        <button class="btn btn-primary gate-go" type="submit">เข้าสู่ระบบ</button>
      </form>
    </div>
  </main>
</div>
</body>
</html>
